image: ghcr.io/katyukha/odood/odoo/18.0:latest

variables:
    SERIES_BRANCH: '18.0'
    ODOO_ADMIN_PASS: admin
    CI_JOB_TOKEN_GIT_HOST: 'gitlab.crnd.pro'

    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.hidden-pip-cache"

.only-stable-branch: &only_stable_branch
    only:
        - "18.0"

.only-dev-branch: &only_dev_branch
    only:
        - /^18.0-.*$/

.except-auto-commits: &except_auto_commits
    except:
        variables:
            - $CI_COMMIT_MESSAGE =~ /\[CI-AUTO-UPDATE\]/
            - $CI_COMMIT_MESSAGE =~ /Translated using Weblate/

# Disable global cache
cache: {}

.pip_cache: &pip_cache_definition
    cache:
        key: ${CI_JOB_NAME}
        paths:
            - "${PIP_CACHE_DIR}"

# Shared setup: link addons and fetch dependencies.
# Requires odoo_requirements.txt at repo root; remove the second line if not needed.
.setup:
  before_script:
    - git config --global --add safe.directory "$(pwd)"
    - odood --config-from-env addons link .
    - odood --config-from-env addons add --single-branch --odoo-requirements ./odoo_requirements.txt

# Shared PostgreSQL sidecar and matching ODOOD_OPT_* variables.
.with-postgres:
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: odoo
    POSTGRES_PASSWORD: odoo
    POSTGRES_DB: postgres
    ODOOD_OPT_DB_HOST: postgres
    ODOOD_OPT_DB_USER: odoo
    ODOOD_OPT_DB_PASSWORD: odoo


stages:
    - lint
    - test
    - deploy

build_env:
    stage: lint
    script:
        - pwd
        - whoami
        - odood info
        - odood status
        - echo "Checking branch compatability $CI_COMMIT_BRANCH" && [[ "$CI_COMMIT_BRANCH" =~ ^18.0(-.*)?$ ]]

lint:
  extends: .setup
  stage: lint
  <<: *pip_cache_definition
  script:
    - odood --config-from-env pre-commit set-up
    - odood --config-from-env pre-commit run
  <<: *except_auto_commits

check-versions:
  extends: .setup
  stage: lint
  script:
    - odood --config-from-env repo check-versions --ignore-translations
  <<: *only_dev_branch
  <<: *except_auto_commits

tests:
  extends:
    - .setup
    - .with-postgres
  stage: test
  script:
    - odood --config-from-env test -t --dir .

migration-tests:
  extends:
    - .setup
    - .with-postgres
  stage: test
  script:
    # Migration tests may fail if dependencies introduce incompatible changes
    # with an older version of this repo — treated as a soft failure.
    - odood --config-from-env test -t --migration --dir .
  allow_failure: true
  <<: *only_dev_branch


update_addons_list_and_trans:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: deploy
    before_script:
        - odoo-helper link .
    script:
        - odoo-helper doc-utils addons-list --installable --sys-name --field name --field license --field version --field summary --field price --format csv . > ./ADDONS.csv
        - odoo-helper doc-utils addons-list --installable --sys-name --field name --field license --field version --field summary --field price --format md . > ./ADDONS.md
        - git add ./ADDONS.csv ./ADDONS.md
        - odoo-helper ci push-changes "[CI-AUTO-UPDATE]"
    <<: *only_stable_branch
    <<: *except_auto_commits
    allow_failure: true
